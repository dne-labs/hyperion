services:
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes: [".:/app"]

  controller:
    build: .
    command: python -m controller.agent
    env_file: .env
    environment:
      HYPERION_GATEWAY_URL: http://gateway:8000
    volumes: [".:/app"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes: ["./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hyperion}
    ports: ["3000:3000"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      HYPERION_GATEWAY_URL: http://gateway:8000
    ports: ["8501:8501"]
    volumes: [".:/app"]
    depends_on: [gateway]
