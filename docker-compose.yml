services:
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      HYPERION_BACKEND: ${HYPERION_BACKEND:-simulator}
      HYPERION_VLLM_URL: http://vllm-cpu:8000
      HYPERION_VLLM_MODEL: ${HYPERION_VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      HYPERION_VIDUR_URL: http://vidur:8100
    ports: ["8000:8000"]
    volumes: [".:/app"]

  controller:
    build: .
    command: python -m controller.agent
    env_file: .env
    environment:
      HYPERION_GATEWAY_URL: http://gateway:8000
    volumes: [".:/app"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes: ["./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hyperion}
    ports: ["3000:3000"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]

  dashboard:
    build:
      context: .
      dockerfile: dashboard-next/Dockerfile
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
    ports: ["8501:3000"]
    depends_on: [gateway]

  # Optional offline capacity simulator. It starts only when explicitly asked:
  # docker compose --profile vidur run --rm vidur --qps 4 --requests 128
  vidur:
    build:
      context: .
      dockerfile: Dockerfile.vidur
    profiles: ["vidur"]
    cpus: 2.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["hyperion_sim.optimizer_api:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
      PYTHONPATH: /workspace:/opt/vidur
      HYPERION_OUTPUT_DIR: /workspace/simulator_output
    ports: ["8101:8100"]
    volumes:
      - .:/workspace

  # Optional real CPU inference. Start explicitly with --profile vllm-cpu.
  # Keep the CPU and sequence limits low on machines without a GPU.
  vllm-cpu:
    image: vllm/vllm-openai-cpu:v0.34.0-x86_64
    profiles: ["vllm-cpu"]
    cpus: 2.0
    shm_size: 2gb
    environment:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      VLLM_CPU_KVCACHE_SPACE: "1"
    ports: ["8100:8000"]
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - Qwen/Qwen2.5-0.5B-Instruct
      - --dtype
      - float32
      - --max-model-len
      - "1024"
      - --max-num-seqs
      - "1"

volumes:
  hf-cache:
