services:
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes: [".:/app"]

  controller:
    build: .
    command: python -m controller.agent
    env_file: .env
    environment:
      HYPERION_GATEWAY_URL: http://gateway:8000
    volumes: [".:/app"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes: ["./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hyperion}
    ports: ["3000:3000"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]

  dashboard:
    build:
      context: .
      dockerfile: dashboard-next/Dockerfile
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
    ports: ["8501:3000"]
    depends_on: [gateway]

  # Optional offline capacity simulator. It starts only when explicitly asked:
  # docker compose --profile vidur run --rm vidur --qps 4 --requests 128
  vidur:
    build:
      context: .
      dockerfile: Dockerfile.vidur
    profiles: ["vidur"]
    volumes: [".:/workspace"]
